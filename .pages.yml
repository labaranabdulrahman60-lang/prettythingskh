media:
  input: images/products
  output: /images/products

content:
  - name: products
    label: 🛍️ Products
    type: file
    path: data/products.json
    fields:
      - name: products
        label: Product List
        type: object
        list: true
        summary: "{name}"
        fields:
          - { name: id, label: "Product ID", type: number }
          - { name: name, label: "Product Name", type: string }
          - { name: price, label: "🛒 Retail Price (₦)", type: number }
          - { name: oldPrice, label: "Old Price (₦)", type: number, required: false }
          - { name: wholesale, label: "Enable Wholesale", type: boolean, default: false }
          - { name: wholesalePrice, label: "📦 Wholesale Price (₦)", type: number, required: false }
          - { name: minOrder, label: "Minimum Order (pcs)", type: number, required: false, default: 10 }
          - name: cat
            label: "Category"
            type: select
            options:
              values:
                - { label: "Beauty & Lips", value: "beauty" }
                - { label: "Nails", value: "nails" }
                - { label: "Phone Cases", value: "cases" }
                - { label: "Eyewear", value: "eyewear" }
                - { label: "Accessories", value: "accessories" }
                - { label: "Wholesale", value: "bundles" }
          - { name: stock, label: "In Stock?", type: boolean, default: true }
          - name: img
            label: "Product Image"
            type: image
            required: false
          - name: colors
            label: "🎨 Available Colors"
            type: object
            list: true
            required: false
            fields:
              - name: name
                label: "Color Name"
                type: select
                options:
                  values:
                    - "Pink"
                    - "Light Pink"
                    - "Dark Pink"
                    - "Rose Gold"
                    - "Rose"
                    - "Peach"
                    - "Coral"
                    - "Raspberry"
                    - "Berry"
                    - "Cherry"
                    - "Strawberry"
                    - "Toast"
                    - "Espresso"
                    - "Red"
                    - "Maroon"
                    - "Black"
                    - "White"
                    - "Clear"
                    - "Silver"
                    - "Gold"
                    - "Beige"
                    - "Nude"
                    - "Brown"
                    - "Orange"
                    - "Yellow"
                    - "Green"
                    - "Teal"
                    - "Blue"
                    - "Navy Blue"
                    - "Purple"
                    - "Lavender"
                    - "Grey"
                    - "Multicolor"
              - { name: hex, label: "Custom HEX (optional — leave blank)", type: string, required: false }
              - { name: available, label: "Available?", type: boolean, default: true }
