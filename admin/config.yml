backend:
  name: git-gateway
  branch: main # Or 'master' if your repo uses that

# This is where uploaded product images will be saved in your repo
media_folder: "images/products"
public_folder: "/images/products"

collections:
  - name: "catalog"
    label: "🛍️ Product Catalog"
    files:
      - name: "products"
        label: "All Products"
        file: "data/products.json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            # This creates a nice summary for each product in the list
            summary: "{{fields.name}} — ₦{{fields.price}}"
            fields:
              - { label: "Product ID", name: "id", widget: "number" }
              - { label: "Product Name", name: "name", widget: "string" }
              - { label: "Price (₦)", name: "price", widget: "number" }
              - { label: "Old Price (₦)", name: "oldPrice", widget: "number", required: false }
              - { label: "Category", name: "cat", widget: "select", options: ["beauty", "nails", "cases", "eyewear", "accessories", "bundles"] }
              - { label: "In Stock?", name: "stock", widget: "boolean", default: true }
              - { label: "Product Image", name: "img", widget: "image" }
